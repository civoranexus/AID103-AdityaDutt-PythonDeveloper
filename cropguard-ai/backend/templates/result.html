<!DOCTYPE html>
<html>
<head>
    <title>Result | CropGuard AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h2>🌾 AI Analysis Result</h2>

<div>
    <p><strong>Crop:</strong> <span id="crop"></span></p>
    <p><strong>Disease Detected:</strong> <span id="disease"></span></p>
    <p><strong>Confidence:</strong> <span id="confidence"></span>%</p>
</div>

<hr>

<h3>💡 AI Recommendations</h3>
<pre id="recommendation"></pre>

<br>
<a href="/">🔁 Analyze another image</a>

<script>
    const data = JSON.parse(localStorage.getItem("cropguard_result"));

    if (!data) {
        document.body.innerHTML = `
            <h2>No analysis data found</h2>
            <a href="/">Go back</a>
        `;
    } else {
        document.getElementById("crop").innerText = data.crop;
        document.getElementById("disease").innerText = data.disease;
        document.getElementById("confidence").innerText = data.confidence;
        document.getElementById("recommendation").innerText = data.recommendation;
    }
</script>

</body>
</html>
