<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropGaurd AI || Disease Detecttion | Civora Nexus</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    <header class="header">
        <img src="https://civoranexus.com/logo.svg"  height="50px" width="50px" alt="Civora Nexus logo" class="logo">
        <h1>CropGaurd AI</h1>
        
    </header>
    <p id="text">AI-based Crop Diease Detection</p>
    <main class="container">
        <section class="card">
            <h2>📷 Upload Crop Image</h2>
            
            <label for="">Crop Type :</label>
            <select>
                <option value="">Tomato</option>
                <option value="">Potato</option>
                <option value="">pepper</option>
            </select>

            <label for="">Growth Stage</label>
            <select>
                <option value="">Seedling</option>
                <option value="">Vegetative</option>
                <option value="">Flowering</option>
                <option value="">Harvest</option>
            </select>

            <label for="">Upload Leaf Image</label>
            <input type="file" accept="image/*" name="" value="">
            
            <div class="btn-center">
                <button class="primary-btn">Analyze with AI</button>
            </div>

        </section>
    </main>

    <footer><p>Powered by Civora Nexus Pvt. Ltd.</p></footer>
</body>
</html>
